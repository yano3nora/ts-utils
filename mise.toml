# https://mise.jdx.dev/
# npm 公開物のビルド (dnt) 結果が runtime version に依存するため、
# global の deno に追従させず project local で明示 pin する。
# bump するときは `deno task build` と release:prepare の通過を確認すること。

[tools]
deno = "2.9.1"

[tasks."release:prepare"]
description = "Bump version, run tests/build, and dry-run npm publish (no publish)"
run = "deno run --allow-read --allow-write --allow-run --allow-env scripts/release.ts prepare"

[tasks."release:publish"]
description = "Push the tagged commit, npm publish, and create the GitHub Release (human-only)"
run = "deno run --allow-read --allow-write --allow-run --allow-env scripts/release.ts publish"
